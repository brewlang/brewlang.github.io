# Test the docs against the brewlang repo next to them, as in development, then publish the site on GitHub Pages
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change of the language that breaks the docs shows up even when the site does not change
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/checkout@v4
        with:
          repository: brewlang/brewlang
          path: brewlang

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build brewlang
        working-directory: brewlang
        run: npm ci && npm run build

      - name: Test and build the site
        working-directory: site
        run: npm ci && npm test && npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
